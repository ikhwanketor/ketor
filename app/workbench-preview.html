  <script>
    (function () {
      window.__ktErrorQueue = window.__ktErrorQueue || [];

      // Dedup within 3s so a burst of the same failure doesn't spam.
      var _lastPush = {};

      function pushError(source, message, detail, level) {
        try {
          var lvl = String(level || 'error').toLowerCase();
          if (lvl !== 'error' && lvl !== 'warning' && lvl !== 'info') lvl = 'error';
          var msg = String(message || 'Unknown');
          var src = String(source || 'runtime');
          var key = lvl + '|' + src + '|' + msg;
          var now = Date.now();
          if (_lastPush[key] && (now - _lastPush[key]) < 3000) return;
          _lastPush[key] = now;

          window.__ktErrorQueue.push({
            id: 'err-' + now + '-' + Math.random().toString(36).slice(2, 8),
            source: src,
            message: msg,
            detail: String(detail || '').slice(0, 600),
            level: lvl,
            timestamp: now
          });
          if (window.__ktErrorQueue.length > 200) {
            window.__ktErrorQueue.splice(0, window.__ktErrorQueue.length - 200);
          }
          if (typeof window.__ktOnError === 'function') {
            try { window.__ktOnError(); } catch (_) { }
          }
        } catch (_) { }
      }

      function showToast(message) {
        var toast = document.getElementById('kt-error-toast');
        if (!toast) {
          toast = document.createElement('div');
          toast.id = 'kt-error-toast';
          toast.style.cssText = 'position:fixed;bottom:36px;right:12px;max-width:340px;background:#3a1d1d;color:#f48771;padding:8px 12px;font:12px/1.4 Consolas,monospace;z-index:99999;border:1px solid #ff4444;border-radius:3px;white-space:pre-wrap;pointer-events:none;opacity:0;transition:opacity 0.2s;';
          document.body.appendChild(toast);
        }
        toast.textContent = String(message || '').slice(0, 240);
        toast.style.opacity = '1';
        clearTimeout(toast._hideTimer);
        toast._hideTimer = setTimeout(function () {
          toast.style.opacity = '0';
        }, 3500);
      }

      // Serialize arbitrary console args into a short readable line.
      function serializeArgs(args) {
        var parts = [];
        for (var i = 0; i < args.length; i++) {
          var a = args[i];
          if (a == null) { parts.push(String(a)); continue; }
          if (typeof a === 'string') { parts.push(a); continue; }
          if (a instanceof Error) {
            parts.push(a.message + (a.stack ? ' :: ' + a.stack.split('\n')[1] : ''));
            continue;
          }
          try {
            var s = JSON.stringify(a);
            if (s && s.length > 240) s = s.slice(0, 240) + '…';
            parts.push(s);
          } catch (_) {
            parts.push(String(a));
          }
        }
        return parts.join(' ');
      }

      // Wrap console.error / console.warn / console.info so that
      // runtime and network failures reach the Problems panel.
      // Guarded so we only wrap once even if script runs twice.
      if (!window.__ktConsoleHooked) {
        window.__ktConsoleHooked = true;
        var _origError = console.error.bind(console);
        var _origWarn = console.warn.bind(console);
        var _origInfo = console.info.bind(console);

        console.error = function () {
          try {
            var args = Array.prototype.slice.call(arguments);
            var msg = serializeArgs(args);
            var stack = '';
            for (var i = 0; i < args.length; i++) {
              if (args[i] instanceof Error && args[i].stack) { stack = args[i].stack; break; }
            }
            pushError('console', msg, stack, 'error');
          } catch (_) { }
          return _origError.apply(null, arguments);
        };

        console.warn = function () {
          try {
            var msg = serializeArgs(Array.prototype.slice.call(arguments));
            pushError('console', msg, '', 'warning');
          } catch (_) { }
          return _origWarn.apply(null, arguments);
        };

        console.info = function () {
          try {
            var msg = serializeArgs(Array.prototype.slice.call(arguments));
            pushError('console', msg, '', 'info');
          } catch (_) { }
          return _origInfo.apply(null, arguments);
        };
      }

      window.addEventListener('error', function (ev) {
        var src = (ev.filename || '?') + ':' + (ev.lineno || 0) + ':' + (ev.colno || 0);
        var msg = ev.message || 'Unknown';
        var stack = ev.error && ev.error.stack ? ev.error.stack : '';
        pushError('js', msg, src + '\n' + stack, 'error');
      });

      window.addEventListener('unhandledrejection', function (ev) {
        var r = ev.reason;
        var msg = (r && r.message) ? r.message : String(r);
        var stack = (r && r.stack) ? r.stack : '';
        pushError('promise', msg, stack, 'error');
      });

      window.__ktShowError = function (title, detail) {
        pushError('app', title, detail, 'error');
        showToast(title);
      };
    })();
  </script>

  <script>
    (function () {
      try {
        var R = window.React, RD = window.ReactDOM;
        if (!R || !RD) {
          window.__ktShowError('Bootstrap', 'React failed to load.');
          return;
        }
        if (!window.Ketor || !window.Ketor.ui || !window.Ketor.ui.KetorWorkbench) {
          window.__ktShowError('Bootstrap', 'Workbench failed to load.');
          return;
        }
        var root = RD.createRoot(document.getElementById('root'));
        root.render(R.createElement(window.Ketor.ui.KetorWorkbench, null));
      } catch (err) {
        window.__ktShowError('Bootstrap Exception',
          (err && err.stack) ? err.stack : String(err));
      }
    })();

  <script>
    (function () {
      window.__ktErrorQueue = window.__ktErrorQueue || [];

      function pushError(source, message, detail) {
        try {
          window.__ktErrorQueue.push({
            id: 'err-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8),
            source: String(source || 'runtime'),
            message: String(message || 'Unknown error'),
            detail: String(detail || ''),
            timestamp: Date.now()
          });
          if (window.__ktErrorQueue.length > 200) {
            window.__ktErrorQueue.splice(0, window.__ktErrorQueue.length - 200);
          }
          if (typeof window.__ktOnError === 'function') {
            try { window.__ktOnError(); } catch (_) { }
          }
        } catch (_) { }
      }

      function showToast(message) {
        var toast = document.getElementById('kt-error-toast');
        if (!toast) {
          toast = document.createElement('div');
          toast.id = 'kt-error-toast';
          toast.style.cssText = 'position:fixed;bottom:36px;right:12px;max-width:340px;background:#3a1d1d;color:#f48771;padding:8px 12px;font:12px/1.4 Consolas,monospace;z-index:99999;border:1px solid #ff4444;border-radius:3px;white-space:pre-wrap;pointer-events:none;opacity:0;transition:opacity 0.2s;';
          document.body.appendChild(toast);
        }
        toast.textContent = String(message || '').slice(0, 240);
        toast.style.opacity = '1';
        clearTimeout(toast._hideTimer);
        toast._hideTimer = setTimeout(function () {
          toast.style.opacity = '0';
        }, 3500);
      }

      window.addEventListener('error', function (ev) {
        var src = (ev.filename || '?') + ':' + (ev.lineno || 0) + ':' + (ev.colno || 0);
        var msg = ev.message || 'Unknown';
        var stack = ev.error && ev.error.stack ? ev.error.stack : '';
        pushError('js', msg, src + '\n' + stack);
      });

      window.addEventListener('unhandledrejection', function (ev) {
        var r = ev.reason;
        var msg = (r && r.message) ? r.message : String(r);
        var stack = (r && r.stack) ? r.stack : '';
        pushError('promise', msg, stack);
      });

      window.__ktShowError = function (title, detail) {
        pushError('app', title, detail);
        showToast(title);
      };
    })();
  </script>

  <script>
    (function () {
      try {
        var R = window.React, RD = window.ReactDOM;
        if (!R || !RD) {
          window.__ktShowError('Bootstrap', 'React failed to load.');
          return;
        }
        if (!window.Ketor || !window.Ketor.ui || !window.Ketor.ui.KetorWorkbench) {
          window.__ktShowError('Bootstrap', 'Workbench failed to load.');
          return;
        }
        var root = RD.createRoot(document.getElementById('root'));
        root.render(R.createElement(window.Ketor.ui.KetorWorkbench, null));
      } catch (err) {
        window.__ktShowError('Bootstrap Exception',
          (err && err.stack) ? err.stack : String(err));
      }
    })();
  </script>
